<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Me First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/static/gsap.min.js"></script>
<script>window.gsap || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script>')</script>
<style>
:root{
  --ink:#1f2b45; --ink-soft:#5a6580; --ink-faint:rgba(31,43,69,.14);
  --paper:#fbf8f1; --paper-edge:#ebe2d1; --rule:rgba(60,100,160,.14); --margin:rgba(185,80,70,.32);
  --table:#d6c3a2; --table-dark:#b39770; --accent:#b8572f; --ok:#2f6b4f; --warn:#a8641c;
  --serif:"Fraunces", Georgia, serif; --sans:"Inter", system-ui, -apple-system, sans-serif;
  --card-w:min(600px, 90vw);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);color:var(--ink);overflow:hidden;font-size:18px;
  background:radial-gradient(ellipse at 50% 26%, #e9d8ba 0%, var(--table) 50%, var(--table-dark) 100%);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;
  background:repeating-linear-gradient(91deg, rgba(110,70,30,.14) 0 2px, transparent 2px 11px),
             repeating-linear-gradient(89deg, rgba(255,255,255,.10) 0 1px, transparent 1px 27px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid rgba(31,43,69,.4);outline-offset:3px}
.hidden{display:none!important}

/* header */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;pointer-events:none;background:linear-gradient(rgba(225,208,178,.97) 55%,rgba(225,208,178,0))}
.topbar > *{pointer-events:auto}
.brand{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:28px;border-radius:3px;background:var(--paper);box-shadow:0 2px 0 var(--paper-edge),0 4px 8px rgba(0,0,0,.15);transform:rotate(-8deg);display:inline-block}
.top-actions{display:flex;gap:8px}
.chipbtn{background:rgba(251,248,241,.7);border:1px solid var(--ink-faint);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-soft);backdrop-filter:blur(4px)}
.chipbtn:hover{color:var(--ink);background:var(--paper)}

/* 3D table decor */
.scene{position:fixed;inset:0;perspective:1400px;perspective-origin:50% 30%;pointer-events:none;z-index:1}
.table{position:absolute;inset:0;transform-style:preserve-3d;transition:opacity .5s}
.deck{position:absolute;left:8%;bottom:12%;width:150px;height:100px;transform-style:preserve-3d}
.deck-card,.paperbg{
  background-color:var(--paper);
  background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(transparent 0 15px,var(--rule) 15px 16px);
  background-size:100% 1.5px,100% 100%;background-position:0 22px,0 30px;background-repeat:no-repeat,repeat;
}
.deck-card{position:absolute;inset:0;border-radius:6px;border:1px solid var(--paper-edge);box-shadow:0 2px 0 var(--paper-edge),0 10px 18px rgba(60,40,20,.18)}
.status{position:absolute;left:0;top:-40px;width:280px;font-size:15px;font-weight:500;color:var(--ink-soft);opacity:0;transition:opacity .3s}
.status.on{opacity:1}
.status::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.box{position:absolute;right:8%;bottom:10%;width:200px;height:150px;transform-style:preserve-3d;opacity:0;transition:opacity .5s}
.box-back{position:absolute;left:0;right:0;bottom:40px;height:90px;border-radius:8px 8px 0 0;background:#93653f;box-shadow:inset 0 6px 12px rgba(0,0,0,.25)}
.box-peek{position:absolute;left:14px;right:14px;bottom:70px;height:0;transition:height .35s}
.box-peek i{position:absolute;left:0;right:0;height:60px;border-radius:4px;background:var(--paper);border:1px solid var(--paper-edge)}
.box-front{position:absolute;left:0;right:0;bottom:0;height:80px;border-radius:6px;background:linear-gradient(#b27d4d,#98663b);
  box-shadow:0 14px 22px rgba(60,40,20,.3),inset 0 2px 0 rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.box-label{background:var(--paper);padding:5px 16px;border-radius:3px;font-size:14px;font-weight:600;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.box-label span{display:block;font-weight:400;color:var(--ink-soft);font-size:13px}

/* stage */
.stage{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:70px 0 40px;overflow-x:hidden;overflow-y:auto}
.stage > *{grid-area:1/1}
.stage.top{place-items:start center}

/* landing */
.landing{text-align:center;width:min(1040px,94vw)}
.kicker{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.landing h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,5vw,62px);line-height:1.05;margin:10px 0 10px;letter-spacing:-.8px}
.landing .sub{font-size:clamp(17px,1.5vw,20px);color:var(--ink-soft);margin:0 auto 24px;max-width:640px;line-height:1.5}
.ask{display:flex;align-items:center;gap:10px;width:min(760px,92vw);margin:0 auto;padding:10px 10px 10px 22px;border-radius:16px;
  box-shadow:0 2px 0 var(--paper-edge),0 24px 44px rgba(50,30,10,.22)}
.ask input{flex:1;border:none;background:transparent;font-family:var(--serif);font-size:23px;color:var(--ink);padding:12px 0;min-width:0}
.ask input:focus-visible{outline:none}
.ask:focus-within{box-shadow:0 2px 0 var(--paper-edge),0 24px 44px rgba(50,30,10,.22),0 0 0 3px rgba(31,43,69,.28)}
.ask input::placeholder{color:rgba(90,101,128,.6)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--ink-faint);background:var(--paper);display:grid;place-items:center;flex:none;transition:transform .15s}
.iconbtn:hover{transform:translateY(-2px)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.rec{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,87,47,.5)}100%{box-shadow:0 0 0 14px rgba(184,87,47,0)}}
.attach-row{margin-top:14px;font-size:15px;color:var(--ink-soft);min-height:24px}
.linkbtn{background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:34px auto 10px;perspective:1100px;width:min(1040px,94vw)}
.tile{height:128px;border:none;border-radius:10px;text-align:left;padding:18px 16px 16px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 2px 0 var(--paper-edge),0 16px 26px rgba(60,40,20,.2);transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.tile{position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.75),rgba(255,255,255,0) 55%)}
.tile:hover::after,.tile:focus-visible::after{opacity:1}
.tile:hover,.tile:focus-visible{box-shadow:0 2px 0 var(--paper-edge),0 34px 44px rgba(60,40,20,.3)}
.tile:focus-visible{transform:translateY(-12px)!important}
.tile .ico{font-size:24px;line-height:1}
.tile.other{border:1.5px dashed rgba(31,43,69,.35);background:rgba(251,248,241,.75)}
.tile b{font-family:var(--serif);font-weight:600;font-size:18px;display:block;line-height:1.15}
.tile span{font-size:12.5px;color:var(--ink-soft);line-height:1.35}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}

/* cards */
.card{width:var(--card-w);perspective:1400px;position:relative}
.card-inner{position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.7,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:28px 34px 26px;min-height:360px;display:flex;flex-direction:column;
  box-shadow:0 2px 0 var(--paper-edge),0 4px 0 #e2d6c0,0 30px 50px rgba(50,30,10,.28);
  background-color:var(--paper);
  background-image:linear-gradient(var(--margin),var(--margin)),repeating-linear-gradient(transparent 0 35px,var(--rule) 35px 36px);
  background-size:100% 2px,100% 100%;background-position:0 70px,0 70px;background-repeat:no-repeat,repeat}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);justify-content:center;align-items:center;text-align:center}
.card-top{display:flex;justify-content:space-between;align-items:center;height:40px}
.label{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.why-link{background:none;border:none;font-size:15px;font-weight:500;color:var(--ink);padding:4px 0;display:flex;gap:6px;align-items:center}
.why-link:hover{text-decoration:underline;text-underline-offset:3px}
.question{font-family:var(--serif);font-weight:600;font-size:clamp(25px,2.6vw,32px);line-height:1.22;margin:16px 0 14px;letter-spacing:-.3px}
.answer-row{display:flex;gap:10px;align-items:flex-start}
.card textarea{flex:1;min-height:108px;resize:none;border:none;background:transparent;color:var(--ink);font-family:var(--serif);font-size:23px;line-height:36px;padding:0 2px}
.card textarea::placeholder{color:rgba(90,101,128,.55)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:16px}
.btn{border-radius:999px;padding:13px 26px;font-size:17px;font-weight:500;border:1.5px solid var(--ink);background:transparent;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:0 8px 18px rgba(31,43,69,.25)}
.btn.ghost{border-color:rgba(31,43,69,.3);background:rgba(255,255,255,.35)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.why-text{font-family:var(--serif);font-size:clamp(23px,2.3vw,28px);line-height:1.38;margin:18px auto 30px;max-width:440px}

/* suggestions */
.suggest{position:absolute;left:18px;right:18px;bottom:18px;z-index:5;border-radius:12px;padding:20px 20px 16px;background:#fffdf7;
  box-shadow:0 -2px 0 var(--paper-edge),0 20px 40px rgba(50,30,10,.25)}
.suggest h4{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--ink-soft)}
.chips{display:grid;gap:10px}
.chip{display:block;width:100%;text-align:left;border:1.5px solid var(--ink-faint);background:var(--paper);border-radius:10px;padding:12px 16px;font-family:var(--serif);font-size:19px;line-height:1.3;transition:border-color .15s,background .15s,box-shadow .15s}
.chip:hover{border-color:var(--ink);background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.chip.all{background:var(--ink);color:var(--paper);border-color:var(--ink);font-family:var(--sans);font-size:17px;font-weight:600;text-align:center}
.chip.all:hover{background:#2c3b5c;border-color:#2c3b5c}
.chip.own{display:flex;gap:8px;padding:6px 6px 6px 16px;align-items:center}
.chip.own input{flex:1;border:none;background:transparent;font-family:var(--serif);font-size:19px;color:var(--ink);padding:6px 0}
.chip.own .btn{padding:8px 16px;font-size:15px}
.suggest-foot{display:flex;justify-content:space-between;margin-top:12px}

/* plan view */
.planview{width:min(1160px,95vw);padding-bottom:40px}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:6px 0 6px}
.plan-title{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.4vw,44px);margin:6px 0 0;letter-spacing:-.5px;line-height:1.1}
.legend{display:flex;gap:10px;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.tag.you{background:var(--ink);color:var(--paper)}
.tag.ai{border:1.5px solid var(--ink);color:var(--ink)}
.tag.upd{background:var(--warn);color:#fff}
.vtabs{display:flex;gap:8px;margin:14px 0 0;min-height:36px}
.vtab{border:1.5px solid var(--ink-faint);background:rgba(251,248,241,.6);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500}
.vtab.on{background:var(--paper);border-color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.flow{position:relative;height:390px;margin:6px 0 22px;perspective:1600px;perspective-origin:50% 0%;--rx:24deg;--ry:0deg}
.plane{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(var(--z,0px)) translateY(var(--y,0px))}
.plane::before{content:"";position:absolute;inset:-10px -20px;border-radius:24px;background:rgba(251,248,241,.28);border:1px dashed rgba(31,43,69,.18);transform:translateZ(-2px)}
.plane svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plane path{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;opacity:.5;vector-effect:non-scaling-stroke}
.node{position:absolute;width:calc(min(186px, (100% - 40px) / var(--n,5) - 14px));border-radius:10px;padding:12px 14px 13px;background:var(--paper);transform:translate(-50%,-50%) translateZ(24px);
  box-shadow:0 2px 0 var(--paper-edge),0 18px 28px rgba(50,30,10,.22);transition:transform .25s,box-shadow .25s;cursor:default}
.node:hover{transform:translate(-50%,-50%) translateZ(70px) scale(1.05);box-shadow:0 2px 0 var(--paper-edge),0 30px 40px rgba(50,30,10,.28);z-index:3}
.node.you{border-top:5px solid var(--ink)}
.node.ai{border-top:5px dashed var(--ink-soft)}
.node.changed{outline:2.5px solid var(--warn);outline-offset:2px}
.node.active{transform:translate(-50%,-50%) translateZ(110px) scale(1.1);z-index:5;box-shadow:0 0 0 3px var(--accent),0 40px 60px rgba(50,30,10,.35)}
.plane.playing .node:not(.active){filter:saturate(.35) brightness(.96) blur(.4px)}
.node{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .3s}
.plane path.flowline{stroke:var(--accent);stroke-width:3;opacity:.9;stroke-dasharray:3 14;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.walk{display:flex;align-items:center;gap:14px;min-height:58px;margin:0 0 14px;padding:12px 18px;border-radius:12px;background:rgba(251,248,241,.85);border:1px solid var(--ink-faint);font-size:16.5px;line-height:1.4}
.walk .wnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;display:grid;place-items:center}
.walk .wtext{flex:1}
.walk .wtext b{font-family:var(--serif);font-size:18px}
.walk .btn{padding:9px 18px;font-size:15px}
@media (prefers-reduced-motion:reduce){.plane path.flowline{animation:none}}
.node .num{position:absolute;top:-14px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.node b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.2;margin:8px 0 4px}
.node p{margin:0;font-size:13.5px;line-height:1.38;color:var(--ink-soft)}
.changes{border-radius:12px;padding:16px 22px;margin:6px 0 16px;background:#fff6e6;border:1.5px solid rgba(168,100,28,.35)}
.changes h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--warn)}
.changes ul{margin:0;padding-left:20px;line-height:1.6;font-size:16px}
.plan-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:8px}
.paper{border-radius:12px;padding:22px 26px;background:var(--paper);box-shadow:0 2px 0 var(--paper-edge),0 18px 30px rgba(50,30,10,.18)}
.paper h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--ink-faint);align-items:baseline}
.row:last-child{border-bottom:none}
.row dt{font-size:14px;font-weight:600}
.row dd{margin:0;font-family:var(--serif);font-size:19px;line-height:1.3}
.stamps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.stamps li{display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.3}
.stamps li i{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-style:normal;font-weight:700;transform:rotate(-10deg)}
.voice{margin-top:14px;font-size:14px;color:var(--ok);display:flex;align-items:center;gap:8px}
.voice.warn{color:var(--warn);display:block;line-height:1.45}
.voice .linkbtn{font-size:14px;margin-left:6px}
.plan-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
.sheet{border-radius:12px;padding:20px 22px;margin-top:18px;background:var(--paper);box-shadow:0 18px 30px rgba(50,30,10,.2)}
.sheet h3{margin:0 0 10px;font-family:var(--serif);font-weight:600;font-size:22px}
.sheet .answer-row textarea{flex:1;min-height:76px;border:1.5px solid var(--ink-faint);border-radius:10px;padding:10px 14px;font-family:var(--serif);font-size:20px;line-height:1.4;resize:vertical;background:#fff;color:var(--ink)}
.sheet .actions{justify-content:flex-end}

/* handoff */
.handoff{width:min(880px,94vw)}
.handoff .face{min-height:auto;padding:30px 36px;background-image:none}
.handoff h2{font-family:var(--serif);font-weight:600;font-size:clamp(30px,3.2vw,40px);margin:6px 0 6px;letter-spacing:-.4px}
.handoff .sub{color:var(--ink-soft);margin:0 0 18px;line-height:1.5}
.card .brief{width:100%;min-height:0;flex:none;height:300px;border:1.5px solid var(--ink-faint);border-radius:10px;padding:16px 18px;font-family:var(--sans);font-size:15.5px;line-height:1.55;color:var(--ink);background:#fff;resize:vertical}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.tool{position:relative;display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:12px;border:1.5px solid var(--ink-faint);background:#fff;text-align:left;transition:transform .2s,box-shadow .2s,border-color .2s}
.tool:hover{transform:translateY(-3px);box-shadow:0 14px 24px rgba(0,0,0,.1);border-color:var(--ink)}
.tool.rec{border-color:var(--ink);box-shadow:0 10px 20px rgba(31,43,69,.14)}
.tool .logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.tool b{display:block;font-size:18px}
.tool span{font-size:13.5px;color:var(--ink-soft)}
.tool .rbadge{position:absolute;top:-11px;right:14px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.handoff-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.signed{font-size:14px;color:var(--ink-soft)}

/* document chip */
.attach-row{display:flex;justify-content:center}
.doc-chip{display:flex;align-items:center;gap:12px;max-width:min(760px,92vw);text-align:left;padding:10px 12px 10px 14px;border-radius:12px;background:var(--paper);border:1.5px solid var(--ink-faint);box-shadow:0 8px 18px rgba(50,30,10,.12)}
.doc-chip .doc-ico{font-size:24px}
.doc-chip .doc-meta{flex:1;min-width:0}
.doc-chip b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-chip small{display:block;font-size:13.5px;color:var(--ink-soft);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.doc-chip.ok{border-color:rgba(47,107,79,.45)} .doc-chip.ok small{color:var(--ok)}
.doc-chip.err{border-color:rgba(168,100,28,.5)} .doc-chip.err small{color:var(--warn)}
.doc-chip.loading small::after{content:"";display:inline-block;width:1.2em;animation:dots 1.2s steps(4) infinite}
.ask.dragging{outline:3px dashed var(--accent);outline-offset:6px}
.reqstrip{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:41;display:flex;align-items:center;gap:10px;max-width:min(640px,52vw);
  padding:8px 16px;border-radius:999px;background:rgba(251,248,241,.92);border:1px solid var(--ink-faint);box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:14px}
.reqstrip .label{flex:none}
.reqstrip b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reqstrip .doc{flex:none;color:var(--ok);font-size:13px}
.hint{font-size:14px;color:var(--ink-soft);margin:12px 0 0}
/* compare (opens like a book) */
.cmp-toggle{margin-left:auto}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin:4px 0 22px;perspective:1800px}
.cmp-col{border-radius:12px;padding:20px 22px;background:var(--paper);box-shadow:0 2px 0 var(--paper-edge),0 20px 34px rgba(50,30,10,.2);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.cmp-col:first-child{transform:rotateY(7deg);transform-origin:right center;opacity:.92}
.cmp-col:last-child{transform:rotateY(-7deg);transform-origin:left center}
.cmp-col:hover{transform:rotateY(0)}
.cmp-col h3{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.cmp-step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 8px;border-radius:8px;border-bottom:1px solid var(--ink-faint)}
.cmp-step:last-child{border-bottom:none}
.cmp-step .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;display:grid;place-items:center}
.cmp-step b{display:block;font-family:var(--serif);font-weight:600;font-size:17px}
.cmp-step p{margin:2px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.4}
.cmp-step.changed{background:#fff6e6;outline:1.5px solid rgba(168,100,28,.4)}
.cmp-step.changed .n{background:var(--warn)}

/* understanding strip, read aloud, preview */
.understood{display:flex;gap:10px;align-items:baseline;margin:6px 0 2px;padding:10px 14px;border-radius:10px;background:#eef4ee;border:1px solid rgba(47,107,79,.25);font-size:15px;line-height:1.4;color:var(--ok)}
.understood b{color:var(--ink);font-weight:600}
.understood .u-text{flex:1}
.understood .linkbtn{font-size:14px;flex:none;margin-left:auto}
.top-right{display:flex;gap:14px;align-items:center}
.listen{background:none;border:none;font-size:15px;font-weight:500;color:var(--ink);padding:4px 0;display:flex;gap:6px;align-items:center}
.listen:hover{text-decoration:underline;text-underline-offset:3px}
.listen.on{color:var(--accent)}
.preview-wrap{margin-top:16px}
.preview{position:relative;margin-top:12px;padding:26px 30px;border-radius:6px;background:#fff;border:1px solid var(--ink-faint);
  box-shadow:0 1px 0 #e9e2d4,0 2px 0 #fff,0 3px 0 #e9e2d4,0 18px 30px rgba(50,30,10,.16);font-size:15.5px;line-height:1.55;max-height:420px;overflow:auto;transform-origin:50% 0}
.preview h1{font-family:var(--serif);font-size:26px;margin:0 0 6px} .preview h2{font-family:var(--serif);font-size:19px;margin:16px 0 6px} .preview h3{font-size:16px;margin:12px 0 4px}
.preview ul{margin:6px 0;padding-left:20px} .preview p{margin:6px 0}
.preview table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14.5px} .preview th,.preview td{border:1px solid var(--ink-faint);padding:6px 9px;text-align:left} .preview th{background:#f6f1e7}
.preview .stamp{position:absolute;top:14px;right:16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:3px 8px;transform:rotate(4deg)}
.shimmer{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,#eee6d6 25%,#f8f3ea 50%,#eee6d6 75%);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* language picker */
.langwrap{position:relative;pointer-events:auto}
.langbtn{display:flex;align-items:center;gap:6px}
.langmenu{position:absolute;top:44px;left:0;z-index:60;width:250px;max-height:60vh;overflow:auto;padding:8px;border-radius:12px;background:var(--paper);border:1px solid var(--ink-faint);box-shadow:0 20px 40px rgba(0,0,0,.18)}
.langmenu button{display:flex;justify-content:space-between;width:100%;padding:9px 12px;border:none;background:none;border-radius:8px;font-size:15px;text-align:left}
.langmenu button:hover,.langmenu button.on{background:#efe7d8}
.langmenu button span{color:var(--ink-soft);font-size:13px}
.rtl .question,.rtl textarea,.rtl .why-text,.rtl .chip,.rtl .brief,.rtl .preview,.rtl .understood,.rtl .landing h1,.rtl .landing .sub,.rtl .ask input,.rtl .vread,.rtl .vsub{direction:rtl;text-align:right}
/* voice card */
.vcard .face{min-height:auto}
.pg-badge{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);border:1.5px solid rgba(47,107,79,.4);border-radius:999px;padding:4px 10px}
.vsub{margin:0 0 12px;color:var(--ink-soft);font-size:16px;line-height:1.45}
.vbox{position:relative;display:flex;gap:10px;align-items:flex-start;border-radius:10px}
.vbox textarea{min-height:140px}
.scan{position:absolute;left:0;right:56px;top:0;height:0;pointer-events:none;opacity:0}
.vcard.scanning .scan{opacity:1;height:4px;background:linear-gradient(90deg,transparent,var(--ok),transparent);box-shadow:0 0 18px 6px rgba(47,107,79,.35);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 4px)}}
.vcard.scanning textarea{filter:saturate(.6)}
.vread{flex:1;font-family:var(--serif);font-size:21px;line-height:1.55;padding:2px}
.vread .seg{padding:1px 2px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.vread .seg.human{background:rgba(47,107,79,.13);border-bottom:2px solid rgba(47,107,79,.6)}
.vread .seg.assist{background:rgba(168,100,28,.14);border-bottom:2px solid rgba(168,100,28,.6)}
.vread .seg.ai{background:rgba(180,68,46,.14);border-bottom:2px solid rgba(180,68,46,.6)}
.vlegend{display:flex;gap:14px;font-size:13px;color:var(--ink-soft);margin-top:10px;flex-wrap:wrap}
.vlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.meter{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.meter svg{width:40px;height:40px;transform:rotate(-90deg)}
.meter circle{fill:none;stroke-width:3.4}
.meter .trk{stroke:var(--ink-faint)} .meter .arc{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .3s}
.vstamp{position:absolute;right:30px;bottom:92px;z-index:6;padding:8px 14px;border:3px solid var(--ok);border-radius:8px;color:var(--ok);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:rgba(251,248,241,.9);transform:rotate(-8deg);pointer-events:none}
.vnote{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fff6e6;border:1px solid rgba(168,100,28,.35);font-size:15px;line-height:1.45;color:var(--warn)}
/* authorship receipt */
.receipt{margin-top:18px;padding:16px 20px;border-radius:10px;background:#fffdf8;border:1.5px dashed rgba(31,43,69,.3);font-size:15px}
.r-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.r-head span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.r-row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--ink-faint);align-items:baseline}
.r-row span{color:var(--ink-soft)} .r-row b{font-weight:600;text-align:right}
.r-toggle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14.5px;color:var(--ink-soft)}
.r-toggle input[type=text]{border:1px solid var(--ink-faint);border-radius:6px;padding:5px 8px;font-size:14.5px;width:150px;background:#fff}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,calc(100% + 60px));opacity:0;max-width:min(620px,92vw);background:var(--ink);color:var(--paper);
  padding:14px 22px;border-radius:12px;font-size:16px;line-height:1.4;box-shadow:0 14px 30px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (max-width:820px){.deck,.box{display:none}.plan-grid,.tools,.compare{grid-template-columns:1fr}.legend{display:none}.reqstrip{display:none}}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){.flow{height:440px}.node{padding:10px 10px 11px}.node b{font-size:15px}.node p{font-size:12.5px}.node .tag{font-size:10px;padding:3px 7px}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.landing{padding-top:24px}.brand{font-size:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px;pointer-events:auto"><div class="brand"><i></i>Ask Me First</div>
    <div class="langwrap"><button class="chipbtn langbtn" id="langBtn" type="button" aria-haspopup="true">&#127760; <span id="langName">English</span></button><div class="langmenu hidden" id="langMenu"></div></div></div>
  <div class="top-actions">
    <button class="chipbtn" id="soundBtn" aria-pressed="true">Sound on</button>
    <button class="chipbtn hidden" id="restartBtn">Start over</button>
  </div>
</div>

<div class="scene"><div class="table" id="table" style="opacity:0">
  <div class="deck" id="deck"><div class="status" id="status">Preparing the next question</div></div>
  <div class="box" id="box">
    <div class="box-back"></div>
    <div class="box-peek" id="boxPeek"></div>
    <div class="box-front" id="boxFront"><div class="box-label">Your choices<span id="boxCount">0 answers</span></div></div>
  </div>
</div></div>

<main class="stage" id="stage">
  <section class="landing" id="landing">
    <div class="kicker">AI, on your terms</div>
    <h1>What would you like to create?</h1>
    <p class="sub">Describe it in your own words. I will ask a few short questions, then prepare everything you need.</p>
    <div class="ask paperbg" id="askBar">
      <input id="reqInput" type="text" autocomplete="off" placeholder="For example: a flyer for my health workshop" aria-label="What would you like to create?">
      <button class="iconbtn mic" id="reqMic" type="button" aria-label="Speak instead of typing"></button>
      <button class="iconbtn" id="attachBtn" type="button" aria-label="Add an existing document" title="Add an existing document"></button>
      <button class="btn primary" id="beginBtn" type="button">Begin</button>
    </div>
    <div class="attach-row" id="attachRow"></div>
    <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.png,.jpg,.jpeg,.heic,.webp">
    <div class="tiles" id="tiles"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="tplVoice">
  <div class="card vcard">
    <div class="card-inner">
      <div class="face front">
        <div class="card-top"><span class="label">Your voice</span></div>
        <h2 class="question">Last one: describe it the way you would tell a friend.</h2>
        <p class="vsub">A few sentences in your own words. The AI will use them to write in your voice.</p>
        <div class="vbox"><textarea rows="4" placeholder="Just talk. There are no wrong answers."></textarea><button class="iconbtn mic" type="button" aria-label="Speak your answer"></button><div class="scan"></div></div>
        <div class="actions">
          <div class="meter"><svg viewBox="0 0 36 36"><circle class="trk" cx="18" cy="18" r="15.9"/><circle class="arc" cx="18" cy="18" r="15.9"/></svg><span class="mcount">0 of 50 words</span></div>
          <div style="display:flex;gap:10px"><button class="btn ghost vskip" type="button">Skip</button><button class="btn primary vgo" type="button">Continue</button></div>
        </div>
        <div class="vnote hidden"></div>
      </div>
    </div>
  </div>
</template>

<template id="tplQ">
  <div class="card qcard">
    <div class="card-inner">
      <div class="face front">
        <div class="card-top"><span class="label qnum"></span>
          <div class="top-right"><button class="listen" type="button" aria-label="Read the question aloud"><span aria-hidden="true">&#128264;</span> Read aloud</button>
          <button class="why-link" type="button"><span aria-hidden="true">&#8635;</span> Why this matters</button></div></div>
        <div class="understood hidden"></div>
        <h2 class="question"></h2>
        <div class="answer-row">
          <textarea rows="3" placeholder="Type your answer, or use the microphone"></textarea>
          <button class="iconbtn mic" type="button" aria-label="Speak your answer"></button>
        </div>
        <div class="actions">
          <div style="display:flex;gap:16px;align-items:center"><button class="btn ghost unsure" type="button">I'm not sure</button><button class="linkbtn skipq" type="button">Skip</button></div>
          <button class="btn primary next" type="button">Continue</button>
        </div>
        <div class="suggest hidden">
          <h4>A few options based on what you have shared. Tap one, or tap again to combine.</h4>
          <div class="chips"></div>
          <div class="suggest-foot">
            <button class="linkbtn skip" type="button">Skip this question</button>
            <button class="linkbtn close" type="button">Close</button>
          </div>
        </div>
      </div>
      <div class="face back">
        <span class="label">Why this matters</span>
        <p class="why-text"></p>
        <button class="btn ghost flipback" type="button">Return to question</button>
      </div>
    </div>
  </div>
</template>

<script>
/* ======================= setup ======================= */
const API = location.protocol === "file:" ? "http://localhost:8000" : "";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ANIM = !!window.gsap && !REDUCE;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const stage = $("#stage"), table = $("#table"), deck = $("#deck"), box = $("#box"), boxFront = $("#boxFront");
const MAX_Q = 6;
const S = { request: "", uploadText: "", history: [], plans: [], current: 0, voice: null, busy: false, lang: "English", speech: "en-US" };

const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11.5l-8.1 8.1a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>',
};
const TILES = [
  { ico: "&#128240;", t: "Flyer or poster", d: "Promote an event, sale or service", ex: "A poster for my bakery's weekend sale" },
  { ico: "&#128196;", t: "Resume", d: "Present your experience", ex: "Update my resume for a project manager role" },
  { ico: "&#127912;", t: "Image or logo", d: "Create a picture or brand mark", ex: "A logo for my landscaping business" },
  { ico: "&#128197;", t: "Event plan", d: "Organize every detail", ex: "Plan a family reunion for 40 people in July" },
  { ico: "&#128269;", t: "Research", d: "Compare options and decide", ex: "Compare the best laptops for a college student under $800" },
  { ico: "&#9993;&#65039;", t: "Letter or email", d: "Write to someone", ex: "A letter to my landlord about an overdue repair" },
  { ico: "&#128202;", t: "Presentation", d: "Slides for a talk or meeting", ex: "A 10-slide presentation for our school fundraiser" },
  { ico: "&#128176;", t: "Budget", d: "Plan and track money", ex: "A monthly household budget for a family of four" },
  { ico: "&#128188;", t: "Business plan", d: "Start or grow a business", ex: "A business plan for a home cleaning service" },
  { ico: "&#128241;", t: "Social media", d: "Posts and captions", ex: "A week of Instagram posts for my yoga studio" },
  { ico: "&#127891;", t: "Lesson or study plan", d: "Teach or learn something", ex: "A lesson plan to teach 9-year-olds about fractions" },
  { ico: "&#10133;", t: "Something else", d: "Describe anything you need", ex: "", other: true },
];
const FALLBACK_Q = [
  { field: "audience", question: "Who is this for?", why: "Knowing the audience shapes every word and design choice.", suggestions: ["A specific group of clients", "Friends, family or neighbors", "A hiring manager or organization"] },
  { field: "purpose", question: "What should happen after someone sees it?", why: "A clear goal lets the AI prioritize what matters most.", suggestions: ["They sign up or attend", "They contact me", "They understand something new"] },
  { field: "key_details", question: "What details must be included?", why: "Specific facts make the result yours rather than generic.", suggestions: ["Date, time and location", "My experience and achievements", "Prices, contacts or links"] },
  { field: "avoid", question: "Is there anything it should avoid?", why: "Clear limits keep the result accurate and give you something to check.", suggestions: ["Technical jargon", "Exaggerated claims", "Stock photos or clichés"] },
];

/* ======================= sound ======================= */
let soundOn = true, actx = null;
function tick(vol = 1, freq = 1700) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(0.06 * actx.sampleRate), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    const g = actx.createGain(); g.gain.value = 0.22 * vol;
    src.connect(f).connect(g).connect(actx.destination); src.start();
  } catch (e) { /* sound is optional */ }
}
$("#soundBtn").onclick = e => { soundOn = !soundOn; e.target.textContent = soundOn ? "Sound on" : "Sound off"; e.target.setAttribute("aria-pressed", soundOn); };
$("#restartBtn").onclick = () => location.reload();

/* ======================= helpers ======================= */
let toastT;
function toast(msg, ms = 4200) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
const center = n => { const r = n.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; };
const offset = (from, to) => { const a = center(from), b = center(to); return { x: a.x - b.x, y: a.y - b.y }; };

function showDecor(on) { table.style.opacity = on ? 1 : 0; }
function setStatus(text) { const s = $("#status"); if (text) { s.textContent = text; s.classList.add("on"); } else s.classList.remove("on"); }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function attachMic(btn, field) {
  btn.innerHTML = ICON.mic;
  if (!SR) { btn.remove(); return; }
  let rec = null;
  btn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = S.speech; rec.interimResults = true; rec.continuous = true;
    const base = field.value.trim() ? field.value.trim() + " " : "";
    rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; field.value = base + t; };
    rec.onerror = ev => { if (ev.error === "not-allowed") toast("Microphone access was blocked. You can type instead."); };
    rec.onend = () => { rec = null; btn.classList.remove("rec"); };
    rec.start(); btn.classList.add("rec"); tick(.6, 900);
  });
}

async function post(path, body, ms = 50000) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctrl.signal });
    if (r.status === 429) { toast("Many requests at once. Please wait a moment and try again."); throw new Error("HTTP 429"); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = 0; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); return ok;
  }
}

/* ======================= deck + table ======================= */
const deckCards = [];
for (let i = 0; i < 7; i++) { const c = el("div", "deck-card"); c._r = (Math.random() - .5) * 6; deck.appendChild(c); deckCards.push(c); }
const BASE_X = 16;
if (ANIM) {
  gsap.set(table, { rotationX: BASE_X });
  deckCards.forEach((c, i) => gsap.set(c, { z: i * 2, rotation: c._r }));
  const rx = gsap.quickTo(table, "rotationX", { duration: .9, ease: "power3" }), ry = gsap.quickTo(table, "rotationY", { duration: .9, ease: "power3" });
  addEventListener("mousemove", e => { const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5; rx(BASE_X - y * 6); ry(x * 7); });
} else {
  table.style.transform = `rotateX(${BASE_X}deg)`;
  deckCards.forEach((c, i) => c.style.transform = `translateZ(${i * 2}px) rotate(${c._r}deg)`);
}

let shuffleTl = null;
function shuffle(on, text) {
  if (on) {
    setStatus(text);
    if (!ANIM) return;
    shuffleTl = gsap.timeline({ repeat: -1, repeatDelay: .15 });
    deckCards.forEach((c, i) => { const d = i % 2 ? 1 : -1;
      shuffleTl.to(c, { x: d * 70, z: 30 + i * 4, rotation: d * 10, duration: .22, ease: "power2.out" }, i * .07)
               .to(c, { x: 0, z: i * 2, rotation: c._r, duration: .22, ease: "power2.in" }, i * .07 + .22); });
  } else {
    setStatus(null);
    if (shuffleTl) { shuffleTl.kill(); shuffleTl = null; }

function wordCount(t) { return (t.trim().match(/\S+/g) || []).length; }
function showVoiceStep() {
  const card = $("#tplVoice").content.firstElementChild.cloneNode(true);
  const ta = card.querySelector("textarea"), arc = card.querySelector(".arc"), count = card.querySelector(".mcount");
  const go = card.querySelector(".vgo"), skip = card.querySelector(".vskip"), note = card.querySelector(".vnote"), vbox = card.querySelector(".vbox");
  attachMic(card.querySelector(".mic"), ta);
  const update = () => {
    const n = wordCount(ta.value);
    arc.style.strokeDasharray = `${Math.min(100, n * 2)} 100`;
    count.textContent = `${Math.min(n, 50)} of 50 words`;
    go.textContent = "Continue";
  };
  ta.addEventListener("input", update);
  const finish = async (withVoice) => {
    if (withVoice) S.history.push({ field: "voice", question: "Describe it the way you would tell a friend.", answer: ta.value.trim() });
    card.querySelectorAll("button").forEach(b => b.disabled = true);
    await flyToBox(card);
    buildPlan();
  };
  skip.onclick = () => finish(false);
  go.onclick = async () => {
    const text = ta.value.trim(), n = wordCount(text);
    if (go.dataset.ready) return finish(true);
    if (!n) { ta.focus(); return; }
    if (n < 50) return finish(true);
    // Pangram reads the person's own words, live
    card.classList.add("scanning"); go.disabled = true; skip.disabled = true; go.textContent = "Reading your words";
    let v = null;
    try { v = await post("/api/voice_check", { text }, 25000); } catch (e) {}
    card.classList.remove("scanning"); go.disabled = false; skip.disabled = false;
    if (!v || !v.eligible) { toast("Your words could not be checked right now. They are still used as written."); go.dataset.ready = 1; go.textContent = "Continue to my plan"; return; }
    S.voice = v;
    // show Pangram's reading, section by section
    const read = el("div", "vread");
    const wins = (v.windows && v.windows.length) ? v.windows : [{ text, label: v.headline || v.label }];
    wins.forEach(w => { const cls = /human/i.test(w.label) ? "human" : /assist/i.test(w.label) ? "assist" : "ai"; read.append(el("span", "seg " + cls, w.text + " ")); });
    const legend = el("div", "vlegend");
    [["Your own words", "rgba(47,107,79,.6)"], ["AI-assisted", "rgba(168,100,28,.6)"], ["AI-generated", "rgba(180,68,46,.6)"]].forEach(([l, c]) => { const sp = el("span"); const i = el("i"); i.style.background = c; sp.append(i, l); legend.appendChild(sp); });
    ta.classList.add("hidden"); card.querySelector(".mic") && card.querySelector(".mic").classList.add("hidden");
    vbox.prepend(read); vbox.after(legend);
    if (ANIM) gsap.from(read.querySelectorAll(".seg"), { backgroundColor: "rgba(0,0,0,0)", stagger: .25, duration: .6 });
    if (!v.ai_like) {
      const st = el("div", "vstamp", "✓ Verified: your own words"); card.querySelector(".face").appendChild(st);
      tick(1, 500);
      if (ANIM) gsap.from(st, { scale: 2.6, rotation: -30, opacity: 0, rotationX: 60, duration: .55, ease: "back.out(2)", delay: .3, transformPerspective: 800 });
      go.dataset.ready = 1; go.textContent = "Continue to my plan";
    } else {
      note.classList.remove("hidden");
      note.textContent = "Parts of this read like AI-polished text. That is completely fine, but the result will sound most like you if you say it the way you would to a friend.";
      go.dataset.ready = 1; go.textContent = "Keep as is";
      skip.textContent = "Rewrite in my words";
      skip.onclick = () => { read.remove(); legend.remove(); note.classList.add("hidden"); ta.classList.remove("hidden"); card.querySelector(".mic") && card.querySelector(".mic").classList.remove("hidden");
        delete go.dataset.ready; S.voice = null; skip.textContent = "Skip"; skip.onclick = () => finish(false); update(); ta.focus(); };
    }
  };
  dealIn(card);
}

async function nextQuestion() {
  shuffle(true, "Preparing the next question");
  let q;
  try { q = await post("/api/next_question", { request: S.request, history: S.history, upload_text: S.uploadText || null, lang: S.lang }); }
  catch (e) {
    const asked = new Set(S.history.map(h => h.field));
    q = S.history.length >= 4 ? { done: true } : { ...(FALLBACK_Q.find(f => !asked.has(f.field)) || {}), done: !FALLBACK_Q.find(f => !asked.has(f.field)) };
    toast("Connection is slow. Continuing with a standard question.");
  }
  shuffle(false);
  S.busy = false;
  if (q.done || S.history.length >= MAX_Q) return showVoiceStep();
  showQuestion(q);
}

function showQuestion(q) {
  const card = $("#tplQ").content.firstElementChild.cloneNode(true);
  card.querySelector(".qnum").textContent = `Question ${S.history.length + 1} of up to ${MAX_Q}`;
  card.querySelector(".question").textContent = q.question;
  card.querySelector(".why-text").textContent = q.why;
  const ta = card.querySelector("textarea");
  attachMic(card.querySelector(".mic"), ta);
  if (q.summary) {
    const u = card.querySelector(".understood"); u.classList.remove("hidden");
    const t = el("span", "u-text"); t.append("\u2713  I understand: ", el("b", null, q.summary.replace(/^You want/i, "you want")));
    u.appendChild(t);
    const ed = el("button", "linkbtn", "Edit request"); ed.type = "button";
    ed.onclick = () => { location.href = location.pathname + "?r=" + encodeURIComponent(S.request); };
    u.appendChild(ed);
  }
  const listen = card.querySelector(".listen");
  if (!("speechSynthesis" in window)) listen.remove();
  else listen.onclick = () => {
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); listen.classList.remove("on"); return; }
    const u = new SpeechSynthesisUtterance(q.question); u.rate = .95; u.lang = S.speech;
    u.onend = () => listen.classList.remove("on"); listen.classList.add("on"); speechSynthesis.speak(u);
  };

  card.querySelector(".why-link").onclick = () => { card.classList.add("flipped"); tick(.7, 1200); card.querySelector(".flipback").focus(); };
  card.querySelector(".flipback").onclick = () => { card.classList.remove("flipped"); tick(.7, 1200); ta.focus(); };

  // "I'm not sure": tailored suggestions, plus a blank option to write your own
  const sheet = card.querySelector(".suggest"), chips = card.querySelector(".chips");
  const openSuggest = () => {
    chips.innerHTML = "";
    (q.suggestions && q.suggestions.length ? q.suggestions : ["Not sure yet"]).forEach(s => {
      const c = el("button", "chip", s); c.type = "button";
      c.onclick = () => { const cur = ta.value.trim(); ta.value = cur && !cur.includes(s) ? cur + "; " + s : s; closeSuggest(); ta.focus(); tick(.6); };
      chips.appendChild(c);
    });
    const list = (q.suggestions && q.suggestions.length ? q.suggestions : []);
    if (list.length > 1) {
      const all = el("button", "chip all", "Use all of these"); all.type = "button";
      all.onclick = () => {
        const cur = ta.value.trim(), parts = cur ? [cur] : [];
        list.forEach(x => { if (!cur.includes(x)) parts.push(x); });
        ta.value = parts.join("; "); closeSuggest(); ta.focus(); tick(.8, 1100);
      };
      chips.appendChild(all);
    }
    const own = el("div", "chip own");
    const inp = el("input"); inp.placeholder = "Or write your own"; inp.setAttribute("aria-label", "Write your own answer");
    const use = el("button", "btn primary", "Use"); use.type = "button";
    const apply = () => { if (inp.value.trim()) { ta.value = inp.value.trim(); closeSuggest(); ta.focus(); } else inp.focus(); };
    use.onclick = apply; inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); apply(); } });
    own.append(inp, use); chips.appendChild(own);
    sheet.classList.remove("hidden"); tick(.6, 1400);
    if (ANIM) { gsap.fromTo(sheet, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: "power3.out", clearProps: "transform,opacity" });
      gsap.fromTo(chips.children, { y: 12, opacity: 0 }, { y: 0, opacity: 1, stagger: .06, duration: .3, ease: "power2.out", delay: .08, clearProps: "transform,opacity" }); }
  };
  const closeSuggest = () => sheet.classList.add("hidden");
  card.querySelector(".unsure").onclick = openSuggest;
  card.querySelector(".close").onclick = closeSuggest;
  card.querySelector(".skip").onclick = () => answer(card, q, "Skipped");
  card.querySelector(".skipq").onclick = () => answer(card, q, "Skipped");

  const go = () => {
    const a = ta.value.trim();
    if (!a) { openSuggest(); return; }
    answer(card, q, a);
  };
  card.querySelector(".next").onclick = go;
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } });
  dealIn(card);
}

async function answer(card, q, a) {
  if (S.busy) return; S.busy = true;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  S.history.push({ field: q.field, question: q.question, answer: a });
  await flyToBox(card);
  await nextQuestion();
}

/* ======================= plan ======================= */
async function buildPlan(change) {
  S.busy = true;
  const prev = change ? S.plans[S.current] : null;
  if (!change) {
    shuffle(true, "Building your plan");
    // Pangram reads the person's own words (50+ words), in parallel. Never blocks.
    const own = [S.request, ...S.history.filter(h => h.answer !== "Skipped").map(h => h.answer)].join(". ");
    if (!S.voice && own.split(/\s+/).length >= 50) post("/api/voice_check", { text: own }).then(v => { S.voice = v; renderVoice(); }).catch(() => {});
  }
  let p;
  const body = { request: S.request, history: S.history, upload_text: S.uploadText || null, previous_plan: prev, change_request: change || null, lang: S.lang };
  try {
    try { p = await post("/api/plan", body, 100000); }
    catch (first) { setStatus("Still working on your plan"); p = await post("/api/plan", body, 100000); }
  } catch (e) {
    shuffle(false); S.busy = false;
    toast("The plan is taking longer than expected. Please try again.");
    if (change) return;
    return showRetry();
  }
  shuffle(false);
  S.plans.push(p); S.current = S.plans.length - 1; S.busy = false;
  if (!change) await showPlanView(); else { comparing = false; renderPlan(true); }
}

function showRetry() {
  const c = el("div", "paper"); c.style.textAlign = "center";
  c.append(el("p", null, "The plan could not be prepared."));
  const b = el("button", "btn primary", "Try again"); b.onclick = () => { c.remove(); buildPlan(); }; c.appendChild(b);
  stage.appendChild(c);
}

    </div>
    <div class="vtabs" id="vtabs"></div>
    <div class="compare hidden" id="compare"></div>
    <div class="flow" id="flow"></div>
    <div class="walk" id="walk"><span class="wnum">&#9654;</span><div class="wtext" id="walkText">Watch how your choices become the finished result.</div><button class="btn ghost" id="playBtn" type="button">Play walkthrough</button></div>
    <div class="changes hidden" id="changes"><h3>What changed</h3><ul></ul></div>
    <div class="plan-grid">
      <div class="paper"><h3>Your choices</h3><dl id="pvChoices"></dl><div id="pvVoice"></div></div>

async function showPlanView() {
  showDecor(false);
  stage.classList.add("top");
  const v = planViewMarkup();
  stage.appendChild(v);
  attachMic($("#changeMic"), $("#changeText"));
  $("#btnChange").onclick = () => { $("#changeSheet").classList.remove("hidden"); $("#changeText").focus(); $("#changeSheet").scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "center" }); };
  $("#changeCancel").onclick = () => $("#changeSheet").classList.add("hidden");
  $("#changeGo").onclick = async () => {
    const t = $("#changeText").value.trim();
    if (!t) { $("#changeText").focus(); return; }
    const btn = $("#changeGo"); btn.disabled = true; btn.textContent = "Updating plan...";
    stage.scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" });
    await buildPlan(t);
    btn.disabled = false; btn.textContent = "Update plan"; $("#changeText").value = ""; $("#changeSheet").classList.add("hidden");
  };
  $("#btnApprove").onclick = () => { stopWalkthrough(); showHandoff(S.plans[S.current]); };

  // gentle mouse tilt on the diagram
  const flow = $("#flow");
  if (!REDUCE) addEventListener("mousemove", e => {
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    flow.style.setProperty("--rx", (24 - y * 8) + "deg"); flow.style.setProperty("--ry", (x * 8) + "deg");
  });
  if (ANIM) gsap.from(v, { opacity: 0, y: 30, duration: .5, clearProps: "opacity,transform" });
  renderPlan(true);
}

function buildPlane(plan, prevPlan, animate) {
  const flow = $("#flow"); flow.innerHTML = "";
  const steps = (plan.steps || []).slice(0, 6), n = steps.length;
  const plane = el("div", "plane"); plane.style.setProperty("--n", n);
  // positions in percent, so the layout never depends on measuring the screen
  const pts = steps.map((_, i) => ({ x: n === 1 ? 50 : 9 + i * (82 / (n - 1)), y: i % 2 ? 67 : 33 }));
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none");
  let d = pts.length ? `M ${pts[0].x} ${pts[0].y}` : "";
  for (let i = 1; i < pts.length; i++) { const cx = (pts[i - 1].x + pts[i].x) / 2; d += ` C ${cx} ${pts[i - 1].y} ${cx} ${pts[i].y} ${pts[i].x} ${pts[i].y}`; }
  const path = document.createElementNS(NS, "path"); path.setAttribute("d", d); svg.appendChild(path);
  const flowline = document.createElementNS(NS, "path"); flowline.setAttribute("d", d); flowline.setAttribute("class", "flowline"); svg.appendChild(flowline);
  plane.appendChild(svg);
  const inners = [];
  steps.forEach((s, i) => {
    const old = prevPlan && prevPlan.steps ? prevPlan.steps[i] : null;
    const changed = !!prevPlan && (!old || old.label !== s.label || old.detail !== s.detail);
    const node = el("div", `node ${s.owner === "you" ? "you" : "ai"}${changed ? " changed" : ""}`);
    node.style.left = pts[i].x + "%"; node.style.top = pts[i].y + "%";
    const inner = el("div", "node-in");
    inner.append(el("span", "num", String(i + 1)),
      el("span", `tag ${changed ? "upd" : s.owner === "you" ? "you" : "ai"}`, changed ? "Updated" : s.owner === "you" ? "From you" : "AI's work"),
      el("b", null, s.label), el("p", null, s.detail));
    node.appendChild(inner); plane.appendChild(node); inners.push(inner);
  });
  flow.appendChild(plane);
  if (ANIM && animate) {
    gsap.fromTo(svg, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.5, ease: "power2.inOut" });
    gsap.fromTo(inners, { y: 40, opacity: 0, scale: .9 }, { y: 0, opacity: 1, scale: 1, duration: .55, ease: "back.out(1.5)",
      stagger: { each: .2, onStart: () => tick(.5, 1500) }, clearProps: "transform,opacity" });
  }
}

function renderCompare() {
  const box = $("#compare"); box.innerHTML = "";
  const b = Math.max(1, S.current), a = b - 1;
  const A = S.plans[a], B = S.plans[b];
  [[A, a, null], [B, b, A]].forEach(([plan, idx, prev]) => {
    const col = el("div", "cmp-col");
    col.appendChild(el("h3", null, `Version ${idx + 1}${idx === S.plans.length - 1 ? " (latest)" : ""}`));
    (plan.steps || []).forEach((s, i) => {
      const old = prev && prev.steps ? prev.steps[i] : null;
      const changed = !!prev && (!old || old.label !== s.label || old.detail !== s.detail);
      const row = el("div", "cmp-step" + (changed ? " changed" : ""));
      const txt = el("div"); txt.append(el("b", null, s.label), el("p", null, s.detail));
      row.append(el("span", "n", String(i + 1)), txt); col.appendChild(row);
    });
    box.appendChild(col);
  });
  if (ANIM) gsap.from(box.children, { rotationY: (i) => i ? -70 : 70, opacity: 0, duration: .7, ease: "power3.out", clearProps: "opacity" });
}

let comparing = false;
let walkToken = 0;
async function playWalkthrough() {
  const token = ++walkToken;
  const plane = document.querySelector("#flow .plane"); if (!plane) return;
  const nodes = [...plane.querySelectorAll(".node")], steps = S.plans[S.current].steps || [];
  const txt = $("#walkText"), num = document.querySelector("#walk .wnum"), btn = $("#playBtn");
  btn.textContent = "Stop"; plane.classList.add("playing");
  for (let i = 0; i < nodes.length; i++) {
    if (token !== walkToken) return;
    nodes.forEach(n => n.classList.remove("active")); nodes[i].classList.add("active");
    const s = steps[i] || {};
    num.textContent = String(i + 1);
    txt.innerHTML = "";
    txt.append(el("b", null, s.label || ""), document.createTextNode("  " + (s.owner === "you" ? "Your decision. " : "The AI's work. ") + (s.detail || "")));
    tick(.6, s.owner === "you" ? 900 : 1600);
    await new Promise(r => setTimeout(r, REDUCE ? 2200 : 2000));
  }
  if (token !== walkToken) return;
  stopWalkthrough("That is the whole plan: your decisions guide the AI, and you approve the result.");
}
function stopWalkthrough(msg) {
  walkToken++;
  const plane = document.querySelector("#flow .plane");
  if (plane) { plane.classList.remove("playing"); plane.querySelectorAll(".node").forEach(n => n.classList.remove("active")); }
  if ($("#playBtn")) $("#playBtn").textContent = "Play walkthrough";
  if ($("#walkText")) $("#walkText").textContent = msg || "Watch how your choices become the finished result.";
  const num = document.querySelector("#walk .wnum"); if (num) num.innerHTML = "&#9654;";
}
function renderPlan(isNew) {
  const p = S.plans[S.current];
  const prev = S.current > 0 ? S.plans[S.current - 1] : null;
  $("#pvTitle").textContent = p.title;
  $("#pvKicker").textContent = `Your plan, version ${S.current + 1}`;
  buildPlane(p, prev, isNew !== false);

  // version tabs + compare toggle
  const tabs = $("#vtabs"); tabs.innerHTML = "";
  if (S.plans.length > 1) {
    S.plans.forEach((_, i) => {
      const t = el("button", "vtab" + (i === S.current && !comparing ? " on" : ""), `Version ${i + 1}`); t.type = "button";
      t.onclick = () => { comparing = false; S.current = i; renderPlan(true); tick(.5, 1100); };
      tabs.appendChild(t);
    });
    const c = el("button", "vtab cmp-toggle" + (comparing ? " on" : ""), comparing ? "Close comparison" : "Compare versions side by side"); c.type = "button";
    c.onclick = () => { comparing = !comparing; renderPlan(false); tick(.6, 1000); };
    tabs.appendChild(c);
  }
  $("#compare").classList.toggle("hidden", !comparing);
  $("#flow").classList.toggle("hidden", comparing);
  $("#walk").classList.toggle("hidden", comparing);
  stopWalkthrough();
  $("#playBtn").onclick = () => ($("#playBtn").textContent === "Stop" ? stopWalkthrough() : playWalkthrough());
  if (isNew !== false && !comparing && !REDUCE) { const tk = walkToken; setTimeout(() => { if (tk === walkToken) playWalkthrough(); }, 2600); }
  if (comparing) renderCompare();

  // what changed
  const ch = $("#changes"), list = (p.changes || []);
  ch.classList.toggle("hidden", !(S.current > 0 && list.length));
  ch.querySelector("ul").innerHTML = ""; list.forEach(c => ch.querySelector("ul").appendChild(el("li", null, c)));

  const dl = $("#pvChoices"); dl.innerHTML = "";
  (p.choices || []).forEach(c => { const r = el("div", "row"); r.append(el("dt", null, c.label), el("dd", null, c.value)); dl.appendChild(r); });
  const ul = $("#pvChecks"); ul.innerHTML = "";
  (p.checks || []).forEach(c => { const li = el("li"); li.append(el("i", null, "✓"), el("span", null, c)); ul.appendChild(li); });
  if (ANIM && isNew !== false) gsap.from(ul.querySelectorAll("i"), { scale: 2.4, opacity: 0, rotation: -40, stagger: .12, duration: .45, ease: "back.out(2)", delay: 1.2, clearProps: "opacity" });
  renderVoice();
}

function renderVoice() {
  const box = $("#pvVoice"); if (!box) return;
  box.innerHTML = "";
  const v = S.voice; if (!v || !v.eligible) return;
  if (!v.ai_like) {
    box.className = "voice"; box.textContent = "✓ Written in your own words. Checked by Pangram.";
  } else {
    box.className = "voice warn";
    box.append("Some of your answers read like AI-polished text. That is fine, but the result works best in your own words. ");
    const k = el("button", "linkbtn", "Keep as is"); k.onclick = () => { box.innerHTML = ""; }; box.appendChild(k);
  }
}

/* ======================= handoff ======================= */
function showHandoff(p) {
  const pv = $("#planview");
  const go = () => {
    pv.classList.add("hidden");
    const card = el("div", "card handoff");
    card.innerHTML = `<div class="card-inner"><div class="face front">
      <div class="kicker">Ready</div>
      <h2>Your instructions are ready</h2>
      <p class="sub">Choose where to create it. The instructions are copied and opened in a new chat for you. You can still edit them below.</p>
      <textarea class="brief" id="brief" aria-label="Your instructions"></textarea>
      <p class="hint">For the smoothest start, sign in to ChatGPT or Claude in this browser first.</p>
      <div class="preview-wrap"><button class="btn ghost" id="previewBtn" type="button">&#128065; Preview a first draft here</button><div id="previewBox"></div></div>
      <div class="tools">
        <button class="tool" data-tool="chatgpt" type="button"><span class="logo" style="background:#10a37f">G</span><div><b>Open in ChatGPT</b><span>Best for images and visual designs</span></div></button>
        <button class="tool" data-tool="claude" type="button"><span class="logo" style="background:#c96442">C</span><div><b>Open in Claude</b><span>Best for writing and careful analysis</span></div></button>
      </div>
      <div class="handoff-foot">
        <div class="signed" id="signed"></div>
        <div style="display:flex;gap:10px"><button class="btn ghost" id="backPlan" type="button">Back to plan</button><button class="btn ghost" id="copyBtn" type="button">Copy instructions</button></div>
      </div></div></div>`;
    stage.appendChild(card);
    $("#brief").value = p.brief;
    const rec = card.querySelector(`.tool[data-tool="${p.best_tool}"]`);
    if (rec) { rec.classList.add("rec"); const b = el("span", "rbadge", "Recommended"); b.title = p.tool_reason || ""; rec.appendChild(b); }
    const words = S.history.filter(h => h.answer !== "Skipped").reduce((n, h) => n + h.answer.split(/\s+/).length, 0);
    $("#signed").textContent = `Based on your ${S.history.length} answers (${words} words in your own words). Plan version ${S.current + 1}.`;
    card.querySelectorAll(".tool").forEach(b => b.onclick = () => openIn(b.dataset.tool));
    $("#copyBtn").onclick = async () => { await copyText($("#brief").value); toast("Instructions copied."); };
    $("#previewBtn").onclick = () => makePreview();
    $("#backPlan").onclick = () => { card.remove(); pv.classList.remove("hidden"); };
    stage.scrollTo({ top: 0 });
    tick(1, 900);
    if (ANIM) gsap.fromTo(card, { rotationY: -90, opacity: 0, scale: .9 }, { rotationY: 0, opacity: 1, scale: 1, duration: .8, ease: "power3.out" });
  };
  if (ANIM) gsap.to(pv, { rotationY: 90, opacity: 0, duration: .45, ease: "power2.in", transformPerspective: 1400, onComplete: () => { gsap.set(pv, { clearProps: "all" }); go(); } });
  else go();
}

function mdToHtml(md) {
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
  const lines = md.replace(/\r/g, "").split("\n"); let html = "", list = false, i = 0;
  const closeList = () => { if (list) { html += "</ul>"; list = false; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l)) {
      closeList(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      html += "<table>" + body.map((r, k) => "<tr>" + cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>";
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(m[1])}</li>`; }
    else if (l.trim()) { closeList(); html += `<p>${inline(l)}</p>`; }
    else closeList();
    i++;
  }
  closeList(); return html;
}

async function makePreview() {
  const btn = $("#previewBtn"), box = $("#previewBox");
  btn.disabled = true; btn.textContent = "Drafting a preview...";
  box.innerHTML = '<div class="preview"><div class="shimmer" style="width:60%"></div><div class="shimmer"></div><div class="shimmer" style="width:85%"></div><div class="shimmer" style="width:70%"></div></div>';
  try {
    const j = await post("/api/preview", { request: S.request, brief: $("#brief").value, lang: S.lang }, 70000);
    if (!j.markdown) throw new Error(j.error || "empty");
    box.innerHTML = '<div class="preview"><span class="stamp">Draft preview</span>' + mdToHtml(j.markdown) + "</div>";
    tick(1, 800);
    if (ANIM) gsap.from(box.firstChild, { rotationX: -70, opacity: 0, duration: .8, ease: "power3.out", transformPerspective: 1200, clearProps: "transform,opacity" });
    btn.textContent = "Refresh preview";
  } catch (e) {
    box.innerHTML = ""; toast("A preview could not be created right now. You can still open the instructions in ChatGPT or Claude.");
    btn.textContent = "Preview a first draft here";
  }
  btn.disabled = false;
}

async function openIn(tool) {
  const text = $("#brief").value;
  await copyText(text);
  const url = tool === "chatgpt" ? "https://chatgpt.com/?q=" + encodeURIComponent(text) : "https://claude.ai/new?q=" + encodeURIComponent(text);
  window.open(url, "_blank", "noopener");
  toast(`Opened in ${tool === "chatgpt" ? "ChatGPT" : "Claude"}. The instructions are also copied, so if the message box is empty, paste with Cmd+V (Ctrl+V on Windows).`, 6500);
}
