name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Byte-compile backend
        run: python -m py_compile backend/*.py
      - name: No real keys in .env.example
        run: |
          if grep -E '^[A-Z_]*API_KEY=.+' backend/.env.example; then
            echo "A key value was committed to .env.example"; exit 1
          fi
      - name: Lint
        run: ruff check backend
      - name: Tests (offline, no keys)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t askmefirst .
      - name: Start in demo mode and check health
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=1 askmefirst
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
